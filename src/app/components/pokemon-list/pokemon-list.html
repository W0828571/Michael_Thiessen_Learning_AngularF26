<div class="pokemon-list">
  <!-- for loop to iterate over the array with track expression -->
  @for (pokemon of pokemonList; track pokemon.id) {
    <app-pokemon-list-item
      [pokemon]="pokemon"
      (opened)="onPokemonOpened($event)"
    ></app-pokemon-list-item>
  } @empty {
    <!-- empty in case the array is ever empty -->
    <p>No Pokémon to display.</p>
  }
</div>
