
<div class="pokemon-card" [class]="'pokemon-card type-' + pokemon().type1" (click)="toggle()">
  <h3>#{{ pokemon().id }} {{ pokemon().name }}</h3>
  <!-- switch to display a different badge depending on whether the pokemon has a second type -->
  @switch (!!pokemon().type2) {
    <!-- case 1: the pokemon has a second type -->
    @case (true) {
      <span class="badge badge-dual">Dual Type</span>
    }
    <!-- default: the pokemon does not have a second type -->
    @default {
      <span class="badge badge-single">Mono Type</span>
    }
  }
  <!-- details only show when the card has been clicked open -->
  @if (expanded) {
    <p>Type 1: {{ pokemon().type1 }}</p>
    <!-- if/else to display the optional second type only when it has a value -->
    @if (pokemon().type2) {
      <p>Type 2: {{ pokemon().type2 }}</p>
    } @else {
      <p></p>
    }
    <p>Base Experience: {{ pokemon().baseExperience }}</p>
  }
</div>
